# ==============================================================================
#  FineNav-Engine Robot Bringup — Real-Robot Configuration
# ==============================================================================
#
#  This file mirrors the getting_started example's sim_localizer.yaml.
#  Only parameters that differ from compiled defaults or are robot-specific
#  (sensor topics, etc.) are listed.  Planners and maps use their built-in
#  defaults unless overridden here.
#
#  Usage:
#    ros2 launch finenav_robot_bringup robot_bringup.launch.py
#    ros2 launch finenav_robot_bringup robot_bringup.launch.py mode:=localization
# ==============================================================================

/**:
  ros__parameters:
    use_sim_time: false
    mode: "navigation"          # "localization" or "navigation"
    point_cloud_topic: "/cloud_registered_body"  # LiDAR point cloud for TemporalVoxelMap

    # ── Terrain analysis ─────────────────────────────────────────────────
    terrain_analysis:
      cost_scaling_factor: 0.5      # Exponential decay for cost inflation
      robot_height: 1.0             # Height gap separating ground layers (m)
      max_gradient: 0.12            # Max allowed neighbour height diff (m)
      nan_fill_radius: 1.0          # Radius around centre to fill NaN ground (m)
      ground_z_offset: 0.125        # Vertical offset added to ground height (m)
      use_simple_z_threshold: false # Simple max-z mode (vs gradient analysis)
      z_obstacle_threshold: 0.06   # Simple-mode obstacle threshold above robot_z (m)
      allow_unknown: false          # Treat out-of-window as free (true) or lethal (false)

# ── Navigator (BT engine) ──────────────────────────────────────────────────
/robot_bringup/finenav_navigator:
  ros__parameters:
    behavior_trees:
      - "finenav_robot_bringup/behavior_trees"

# ── Localizer (observation-driven, no ESKF) ───────────────────────────────
# 架构：PoseAnchor(EMA 平滑绝对位姿) + Integrator(RelPose 帧间积分) + VelocityProvider
# Fast-LIO 提供 /Odometry → RelPose 积分 + twist 速度
# /localization_pose 提供绝对位姿修正 → EMA 平滑收敛
/robot_bringup/finenav_localizer:
  ros__parameters:

    # ── 绝对位姿源（PoseWithCovarianceStamped）─────────────────────────────
    pose_topic: ""                # 空 = 禁用（Fast-LIO Odometry 自带绝对位姿，无需额外修正）
    pose_smoothing_time: 0.5       # EMA 平滑收敛时间 [s]（pose_topic 为空时无效）

    # ── 初始位姿（一次性订阅，收到后自动取消）───────────────────────────
    initial_pose_topic: "/initialpose"

    # ── 速度源（TwistWithCovarianceStamped）────────────────────────────────
    twist_topic: ""                # 空 = 禁用

    # ── 里程计源（Odometry）───────────────────────────────────────────────
    # odom.pose 始终做帧间差分积分位置（死推算）
    # odom_use_twist: true → 直接用 odom.twist 设置速度
    odom_topic: "/Odometry"        # Fast-LIO LiDAR-inertial odometry
    odom_use_twist: true

    # ── 输出 ──────────────────────────────────────────────────────────────
    force_2d_mode: true            # z/roll/pitch 输出前清零
    publish_tf: true               # 广播 map → base_link
    publish_odom: true             # 发布 ~/nav_state (nav_msgs/Odometry)

# ── Temporal Voxel Map (dynamic obstacle layer from LiDAR) ─────────────────
/robot_bringup/temporal_map:
  ros__parameters:
    update_rate_hz: 20.0       # Sensor fusion update rate (Hz)
    shift_rate_hz: 50.0        # Window-follow-robot check rate (Hz)
    shift_margin_ratio: 0.5    # Trigger shift when robot > 50% from centre

    temporal_voxel_map:
      resolution: 0.1          # Voxel size (m)
      map_length: 30.0         # Rolling window side length (m)
      min_range: 0.3           # Min LiDAR range (m)
      max_range: 30.0          # Max LiDAR range (m)
      min_angle: -1.047        # FOV start, azimuth from +X in XY plane (rad, -π/3 = right 60°)
      max_angle: 1.047         # FOV end,   azimuth from +X in XY plane (rad, +π/3 = left 60°)
      decay_time_sec: 2.0      # Voxel lifetime outside FOV (s)
      decay_time_fov_sec: 0.25 # Voxel lifetime inside FOV (s)

# ── Static Occupancy Grid Map ──────────────────────────────────────────────
/robot_bringup/occ_map:
  ros__parameters:
    update_rate_hz: 5.0        # Map update check rate (Hz)

    occupancy_grid_2d:
      occupancy_threshold: 65  # Cells >= 65 are occupied

# ── Route Planner (A*) ─────────────────────────────────────────────────────
/robot_bringup/route_layer:
  ros__parameters:
    astar_planner:
      connectivity: "N8"        # 8-connected grid search
      heuristic: "Euclidean"
      goal_tolerance_m: 0.5
      max_iterations: 1000000
      max_planning_time: 5.0
      movement_weight: 1.0
      greedy_weight: 1.001

# ── MPPI Controller ────────────────────────────────────────────────────────
/robot_bringup/mppi_layer:
  ros__parameters:
    # ── MPPI core ──────────────────────────────────────────────────────────
    controller:
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      temperature: 0.1

      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4

      vx_max: 1.0
      vy_max: 0.0
      wz_max: 1.5

    # ── Enabled critics ────────────────────────────────────────────────────
    critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
              "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
              "PathAngleCritic", "PreferForwardCritic"]
